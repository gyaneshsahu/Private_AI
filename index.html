<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <!-- Icons from the official logo kit (public/logo, see its README.txt). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo/favicon/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Home-screen app (docs/pwa-20261125.md): on an iPhone it opens in its own window, with this name under the icon. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CometRow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#fbfcfe" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1b1e" media="(prefers-color-scheme: dark)" />
    <title>CometRow</title>
    <meta name="description" content="A private AI assistant." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CometRow" />
    <meta property="og:title" content="CometRow" />
    <meta property="og:description" content="A private AI assistant." />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- The start screen: the mark on the page colour until the app has loaded and replaces it. -->
    <style>
      .boot{position:fixed;inset:0;display:grid;place-items:center;background:#fbfcfe}
      .boot img{width:88px;height:88px}
      .boot .on-dark{display:none}
      @media (prefers-color-scheme:dark){.boot{background:#1b1b1e}.boot .on-light{display:none}.boot .on-dark{display:block}}
    </style>
    <div id="root">
      <div class="boot" role="img" aria-label="CometRow">
        <img class="on-light" src="/logo/svg/cometrow-A-icon-dark.svg" alt="" />
        <img class="on-dark" src="/logo/svg/cometrow-A-icon-light.svg" alt="" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
