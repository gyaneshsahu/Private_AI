name: Hosted foundation smoke (no inference)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/hosted-smoke.mjs
        env:
          PRIVATEAI_DEV_ORIGIN: ${{ vars.PRIVATEAI_DEV_ORIGIN }}
          PRIVATEAI_DEV_ACCESS_KEY: ${{ secrets.PRIVATEAI_DEV_ACCESS_KEY }}
