name: Hosted foundation smoke (no inference)
on:
  workflow_dispatch:
  push:
    branches: [codex/provider-qualification]
permissions:
  contents: read
jobs:
  smoke:
    if: vars.PRIVATEAI_DEV_ORIGIN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, Node 24
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Use the installed Playwright browser
        run: node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log("CHROMIUM_PATH=" + chromium.executablePath())' >> "$GITHUB_ENV"
      - run: node scripts/hosted-smoke.mjs
        env:
          PRIVATEAI_DEV_ORIGIN: ${{ vars.PRIVATEAI_DEV_ORIGIN }}
          PRIVATEAI_DEV_ACCESS_KEY: ${{ secrets.PRIVATEAI_DEV_ACCESS_KEY }}
